# The controller's own dependencies when idf.py builds it as a component
# (firmware/ adds this directory). TesserAPI, TesserUI and TesserKIT aren't
# listed: the firmware adds the checkouts deps.lock pins, as TesserKIT asks.
dependencies:
  idf:
    version: ">=5.2"
  # The wire: chip timings and the RMT (docs/DESIGN.md section 5.3). 3.1 has
  # the asynchronous refresh and custom timings.
  espressif/led_strip:
    version: "^3.1.0"
